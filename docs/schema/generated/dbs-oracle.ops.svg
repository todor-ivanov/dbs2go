<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1014 415" width="1014" height="415" role="img" aria-labelledby="title desc">
<title id="title">DBS relational map — Migration and instance metadata</title>
<desc id="desc">DBS tables with exact foreign-key column connections, generated directly by the Go schema tool.</desc>
<defs><marker id="fk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#147887"/></marker></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<text x="32" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#172b4d">Migration and instance metadata</text>
<text x="32" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#52657a">Migration requests and DBS schema/version metadata. Exact arrows run from FK source columns to referenced PK/UQ columns.</text>
<rect x="32" y="82" width="12" height="12" rx="2" fill="#E6F5ED" stroke="#17734D"/><text x="50" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Core</text>
<rect x="160" y="82" width="12" height="12" rx="2" fill="#E9F2FC" stroke="#245FA9"/><text x="178" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Lookup</text>
<rect x="288" y="82" width="12" height="12" rx="2" fill="#F3EAFF" stroke="#7047AA"/><text x="306" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Parentage</text>
<rect x="416" y="82" width="12" height="12" rx="2" fill="#FFF0DF" stroke="#AC5516"/><text x="434" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Config</text>
<rect x="544" y="82" width="12" height="12" rx="2" fill="#E8F4F5" stroke="#147887"/><text x="562" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Operations</text>
<rect x="672" y="82" width="12" height="12" rx="2" fill="#F1F3F5" stroke="#596675"/><text x="690" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Other</text>
<text x="32" y="112" font-family="ui-monospace, monospace" font-size="10" fill="#52657a">PK primary key · FK foreign key · UQ unique · NN not null · +N folded columns are in the dictionary</text>
<path d="M 402.0 227.5 H 493.0 V 311.5 H 612.0" fill="none" stroke="#147887" stroke-width="1.6" opacity="0.82" marker-end="url(#fk-arrow)"/>
<rect x="445.0" y="210.5" width="124.0" height="17" rx="3" fill="#ffffff" opacity="0.94"/><text x="507.0" y="222.5" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#147887">MR_MB · CASCADE</text>
<g id="table-DBS_VERSIONS">
<rect x="612.0" y="132.0" width="370.0" height="81.0" rx="7" fill="#ffffff" stroke="#147887" stroke-width="1.4"/>
<path d="M 612.0 139.0 h 370.0 v 45.0 h -370.0 z" fill="#E8F4F5"/>
<text x="622.0" y="151.0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#147887">DBS_VERSIONS</text>
<text x="622.0" y="168.0" font-family="system-ui, sans-serif" font-size="9.5" fill="#53657a">PK PK_DV · +6 folded</text>
<rect x="612.0" y="184.0" width="370.0" height="29.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="620.0" y="200.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">PK NN</text>
<text x="682.0" y="200.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">DBS_VERSION_ID</text>
<text x="974.0" y="200.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">INTEGER</text>
<circle cx="612.0" cy="198.5" r="2.5" fill="#147887"/><circle cx="982.0" cy="198.5" r="2.5" fill="#147887"/>
</g>
<g id="table-MIGRATION_BLOCKS">
<rect x="32.0" y="132.0" width="370.0" height="139.0" rx="7" fill="#ffffff" stroke="#147887" stroke-width="1.4"/>
<path d="M 32.0 139.0 h 370.0 v 45.0 h -370.0 z" fill="#E8F4F5"/>
<text x="42.0" y="151.0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#147887">MIGRATION_BLOCKS</text>
<text x="42.0" y="168.0" font-family="system-ui, sans-serif" font-size="9.5" fill="#53657a">PK PK_MB · +6 folded</text>
<rect x="32.0" y="184.0" width="370.0" height="29.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="40.0" y="200.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">PK NN</text>
<text x="102.0" y="200.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">MIGRATION_BLOCK_ID</text>
<text x="394.0" y="200.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">INTEGER</text>
<circle cx="32.0" cy="198.5" r="2.5" fill="#147887"/><circle cx="402.0" cy="198.5" r="2.5" fill="#147887"/>
<rect x="32.0" y="213.0" width="370.0" height="29.0" fill="#f8fafc" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="40.0" y="229.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">FK UQ NN</text>
<text x="102.0" y="229.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">MIGRATION_REQUEST_ID</text>
<text x="394.0" y="229.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">INTEGER</text>
<circle cx="32.0" cy="227.5" r="2.5" fill="#147887"/><circle cx="402.0" cy="227.5" r="2.5" fill="#147887"/>
<rect x="32.0" y="242.0" width="370.0" height="29.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="40.0" y="258.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">UQ</text>
<text x="102.0" y="258.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">MIGRATION_BLOCK_NAME</text>
<text x="394.0" y="258.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">VARCHAR2(700)</text>
<circle cx="32.0" cy="256.5" r="2.5" fill="#147887"/><circle cx="402.0" cy="256.5" r="2.5" fill="#147887"/>
</g>
<g id="table-MIGRATION_REQUESTS">
<rect x="612.0" y="245.0" width="370.0" height="110.0" rx="7" fill="#ffffff" stroke="#147887" stroke-width="1.4"/>
<path d="M 612.0 252.0 h 370.0 v 45.0 h -370.0 z" fill="#E8F4F5"/>
<text x="622.0" y="264.0" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#147887">MIGRATION_REQUESTS</text>
<text x="622.0" y="281.0" font-family="system-ui, sans-serif" font-size="9.5" fill="#53657a">PK PK_MR · +8 folded</text>
<rect x="612.0" y="297.0" width="370.0" height="29.0" fill="#ffffff" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="620.0" y="313.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">PK NN</text>
<text x="682.0" y="313.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">MIGRATION_REQUEST_ID</text>
<text x="974.0" y="313.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">INTEGER</text>
<circle cx="612.0" cy="311.5" r="2.5" fill="#147887"/><circle cx="982.0" cy="311.5" r="2.5" fill="#147887"/>
<rect x="612.0" y="326.0" width="370.0" height="29.0" fill="#f8fafc" stroke="#e5eaf0" stroke-width="0.6"/>
<text x="620.0" y="342.0" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#64748b">UQ</text>
<text x="682.0" y="342.0" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#172b4d">MIGRATION_INPUT</text>
<text x="974.0" y="342.0" text-anchor="end" font-family="ui-monospace, monospace" font-size="9" fill="#52657a">VARCHAR2(700)</text>
<circle cx="612.0" cy="340.5" r="2.5" fill="#147887"/><circle cx="982.0" cy="340.5" r="2.5" fill="#147887"/>
